[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huian-mahjong-assistant"
version = "0.1.0"
description = "Evidence-driven Huian Mahjong rules, simulation, and vision tooling"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []

[project.scripts]
huian-hint-alpha = "workspace.hint_alpha.app:main"

[project.optional-dependencies]
# Kept intentionally small: the built-in unittest runner is sufficient for CI.
dev = [
    "ruff>=0.6",
    "black>=24.0",
]
vision = [
    "opencv-python-headless>=4.10,<6",
    "Pillow>=10,<13",
]
hint-alpha = [
    "windows-capture>=2,<3; platform_system == 'Windows'",
    "pywin32>=311; platform_system == 'Windows'",
    "opencv-python>=4.10,<6",
    "Pillow>=10,<13",
    "numpy>=2,<3",
]

[tool.setuptools.packages.find]
where = [
    ".",
    "legacy_code/core_v0.1.1",
    "legacy_code/environment_v0.1",
]
include = [
    "huian*",
    "mahjong_framework*",
    "workspace.ai*",
    "workspace.simulator*",
    "workspace.vision*",
    "workspace.hint_alpha*",
    "qzcore*",
    "qzenv*",
]
exclude = [
    "tests*",
    "legacy_code*",
    "workspace.tests*",
    "workspace.data*",
    "dataset*",
    "references*",
]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy_code", "dataset", "references"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "/legacy_code/"
