[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huian-mahjong-assistant"
version = "0.1.0"
description = "Evidence-driven Huian two-player Mahjong: rules, environment, 8-hand simulation, AI, and vision; UNKNOWN rules are never hard-coded"
keywords = ["mahjong", "huian", "python", "computer-vision", "game-ai"]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []

[project.scripts]
huian-hint-alpha = "workspace.hint_alpha.app:main"

[project.optional-dependencies]
# Kept intentionally small: the built-in unittest runner is sufficient for CI.
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "coverage>=7,<8",
]
vision = [
    "opencv-python-headless>=4.10,<6",
    "Pillow>=10,<13",
]
hint-alpha = [
    "windows-capture>=2,<3; platform_system == 'Windows'",
    "pywin32>=311; platform_system == 'Windows'",
    "opencv-python>=4.10,<6",
    "Pillow>=10,<13",
    "numpy>=2,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "huian*",
    "mahjong_framework*",
    "workspace.ai*",
    "workspace.simulator*",
    "workspace.vision*",
    "workspace.hint_alpha*",
]
exclude = [
    "tests*",
    "legacy_code*",
    "workspace.tests*",
    "workspace.data*",
    "dataset*",
    "references*",
]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy_code", "dataset", "references"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "/legacy_code/"
