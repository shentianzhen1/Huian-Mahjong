name: Ordinary Rules Closed Benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ordinary-rules-closed-once.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run ordinary rule-gap benchmark
        run: python -m workspace.simulator.rule_gap_benchmark --count 10 --max-examples 2
