name: Roboflow Public Trial

on:
  pull_request:
    paths:
      - ".github/workflows/roboflow-public-trial.yml"
      - "workspace/vision/roboflow_public_eval.py"
      - "workspace/vision/roboflow_video_probe.py"
      - "tests/test_roboflow_public_eval.py"
      - "tests/test_roboflow_video_probe.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/roboflow-public-trial.yml"
      - "workspace/vision/roboflow_public_eval.py"
      - "workspace/vision/roboflow_video_probe.py"
  workflow_dispatch:
    inputs:
      run_cloud:
        description: "Allow up to 9 uploads of already-public archived screenshots"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: roboflow-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Offline source audit and synthetic trials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project Vision extras (no Roboflow network calls)
        run: python -m pip install -e ".[vision]"
      - name: Run source/hash, classification and synthetic video tests
        run: |
          python -B -m unittest discover -s tests -p "test_roboflow_*.py" -v
      - name: Verify 17 approved face labels and public-source screenshot hashes
        run: |
          python -B -m workspace.vision.roboflow_public_eval \
            --root . \
            --manifest references/vision/2026-09-22/public_identity_labels_v0_1.json \
            --output "$RUNNER_TEMP/roboflow_public_offline.json"
          python - "$RUNNER_TEMP/roboflow_public_offline.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["mode"] == "offline_integrity_only"
          assert data["verified_public_images"] == 9
          assert data["approved_face_labels"] == 17
          assert data["model_calls"] == 0
          assert data["approved_box_tile_recall"] is None
          assert data["safe_for_executor"] is False
          print("Public screenshots verified; no model recognition rate claimed.")
          PY

  cloud:
    name: Optional live model comparison on trusted main only
    needs: offline
    # PRs NEVER receive secrets or upload source pixels.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_cloud))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install hosted inference client
        run: python -m pip install -e ".[vision]" "inference-sdk>=1.5,<2"
      - name: Evaluate up to 9 previously published Mahjong screenshots
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
        run: |
          if [ -z "$ROBOFLOW_API_KEY" ]; then
            echo "SKIPPED: no Actions secret configured. Offline verification is complete."
            exit 0
          fi
          python -B -m workspace.vision.roboflow_public_eval \
            --root . \
            --manifest references/vision/2026-09-22/public_identity_labels_v0_1.json \
            --cloud \
            --output "$RUNNER_TEMP/roboflow_public_cloud.json"
      - name: Publish aggregate-only report (no pixels, credentials or API responses)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roboflow-public-screenshot-trial
          path: ${{ runner.temp }}/roboflow_public_cloud.json
          if-no-files-found: ignore
          retention-days: 7

