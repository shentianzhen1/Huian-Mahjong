name: MeldAware V010 Pilot

on:
  push:
    paths:
      - ".github/workflows/meld-aware-v010-pilot-once.yml"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { block: seeds_160000_160004, start: 160000, stop: 160005 }
          - { block: seeds_160005_160009, start: 160005, stop: 160010 }
          - { block: seeds_160010_160014, start: 160010, stop: 160015 }
          - { block: seeds_160015_160019, start: 160015, stop: 160020 }
          - { block: seeds_160020_160024, start: 160020, stop: 160025 }
          - { block: seeds_162000_162004, start: 162000, stop: 162005 }
          - { block: seeds_162005_162009, start: 162005, stop: 162010 }
          - { block: seeds_162010_162014, start: 162010, stop: 162015 }
          - { block: seeds_162015_162019, start: 162015, stop: 162020 }
          - { block: seeds_162020_162024, start: 162020, stop: 162025 }
          - { block: seeds_164000_164004, start: 164000, stop: 164005 }
          - { block: seeds_164005_164009, start: 164005, stop: 164010 }
          - { block: seeds_164010_164014, start: 164010, stop: 164015 }
          - { block: seeds_164015_164019, start: 164015, stop: 164020 }
          - { block: seeds_164020_164024, start: 164020, stop: 164025 }
          - { block: seeds_166000_166004, start: 166000, stop: 166005 }
          - { block: seeds_166005_166009, start: 166005, stop: 166010 }
          - { block: seeds_166010_166014, start: 166010, stop: 166015 }
          - { block: seeds_166015_166019, start: 166015, stop: 166020 }
          - { block: seeds_166020_166024, start: 166020, stop: 166025 }
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run MeldAware V0.10 versus CurrentAgent V0.6
        env:
          BLOCK: ${{ matrix.block }}
          START: ${{ matrix.start }}
          STOP: ${{ matrix.stop }}
        run: |
          python -B - <<'PY'
          import json, os
          from collections import Counter
          from time import perf_counter
          from huian._legacy import env
          from workspace.ai import MeldAwareShantenAgent, TenpaiRiskTieBreakAgent
          from workspace.simulator import run_paired_real_matches

          counters = Counter()

          class CountingMeldAgent(MeldAwareShantenAgent):
              def choose_decision(self, observation, legal_actions):
                  claims = [a for a in legal_actions
                            if a.type in (env.ActionType.CHI, env.ActionType.PENG)]
                  if claims:
                      counters["claim_opportunities"] += 1
                      counters["chi_available"] += int(any(
                          a.type == env.ActionType.CHI for a in claims))
                      counters["peng_available"] += int(any(
                          a.type == env.ActionType.PENG for a in claims))
                  decision = super().choose_decision(observation, legal_actions)
                  if claims:
                      if decision.action.type == env.ActionType.CHI:
                          counters["chi_taken"] += 1
                      elif decision.action.type == env.ActionType.PENG:
                          counters["peng_taken"] += 1
                      elif decision.action.type == env.ActionType.PASS:
                          counters["claim_passed"] += 1
                          if "gold-in-hand guard" in decision.reason:
                              counters["gold_guard_pass"] += 1
                  return decision

          def v10(seed=None):
              return CountingMeldAgent(seed=seed, template_samples=32)

          def v06(seed=None):
              return TenpaiRiskTieBreakAgent(seed=seed, template_samples=32)

          start = int(os.environ["START"])
          stop = int(os.environ["STOP"])
          started = perf_counter()
          report = run_paired_real_matches(
              range(start, stop),
              agent_factories=(v10, v06),
              agent_names=("MeldAwareV010", "CurrentV06"),
              max_steps=1000,
              initial_dealer=0,
          )
          payload = report.to_dict()
          payload.pop("per_match", None)
          payload["block"] = os.environ["BLOCK"]
          payload["claim_counts"] = dict(counters)
          payload["elapsed_seconds"] = perf_counter() - started
          print("V010_PILOT_START")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          print("V010_PILOT_END")
          PY
