name: Calibration Context Export Temporary

on:
  push:
    branches:
      - feature/public-candidate-tracker-v0-1
    paths:
      - ".github/workflows/calibration-context-export-temporary.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v4
        with:
          name: public-detector-context-images
          if-no-files-found: error
          retention-days: 1
          path: |
            references/gameplay/2026-09-15/66fe863f_youjin100/*.jpg
            references/gameplay/2026-09-15/b3892b34_zimo68/*.jpg
