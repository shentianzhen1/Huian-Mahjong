name: No Kong Fee Match Benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/no-kong-fee-match-once.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run 10-seed swapped-seat real ordinary match benchmark
        run: python -m workspace.simulator.rule_gap_benchmark --count 10 --max-examples 1
