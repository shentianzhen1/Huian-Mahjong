name: Public Identity Shadow Temporary

on:
  push:
    branches:
      - experiment/public-identity-shadow-v0-1
    paths:
      - ".github/workflows/public-identity-shadow-temporary.yml"

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Vision dependencies
        run: python -m pip install -e ".[vision]"
      - name: Evaluate existing templates on reviewed public discard crops
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          from PIL import Image

          from workspace.vision.public_detector_calibration import load_manifest
          from workspace.vision.public_tile_detector import (
              best_target_coverage,
              detect_public_tile_geometry,
          )
          from workspace.vision.tiles_v0_1.labels import approved_labels
          from workspace.vision.tiles_v0_1.template_classifier import (
              TemplateTileClassifier,
          )

          root = Path(".")
          dataset = root / "dataset" / "tiles_runtime_v0_2"
          manifest = load_manifest(
              root / "references" / "vision" / "2026-09-22"
              / "public_detector_calibration_v0_1.json"
          )
          labels = approved_labels(dataset)
          samples = [sample for sample in manifest.samples if sample.target == "discard"]

          rows = []
          for sample in samples:
              training = [
                  row for row in labels
                  if (
                      row.get("source_session")
                      or row.get("source_id")
                      or "unknown"
                  ) != sample.source_session
              ]
              excluded = len(labels) - len(training)
              classifier = TemplateTileClassifier.from_labels(dataset, training)

              with Image.open(root / sample.image_path) as source:
                  image = source.convert("RGB")
              width, height = image.size
              assert sample.bbox is not None
              nx, ny, nw, nh = sample.bbox
              truth_box = (
                  int(round(nx * width)),
                  int(round(ny * height)),
                  int(round(nw * width)),
                  int(round(nh * height)),
              )

              detection = detect_public_tile_geometry(
                  image,
                  frame=sample.frame_index,
                  session=sample.source_session,
              )
              _, best = best_target_coverage(detection, sample.bbox)
              assert best is not None

              crop_boxes = {
                  "truth_bbox": truth_box,
                  "detector_bbox": best.pixel_bbox,
              }
              for crop_kind, (x, y, w, h) in crop_boxes.items():
                  crop = image.crop((x, y, x + w, y + h))
                  for region in (None, "hand_region", "draw_visual"):
                      region_name = "global" if region is None else region
                      try:
                          result = classifier.classify(crop, region=region)
                      except ValueError as exc:
                          rows.append({
                              "sample_id": sample.sample_id,
                              "expected": sample.expected_tile,
                              "crop": crop_kind,
                              "region": region_name,
                              "prediction": None,
                              "confidence": None,
                              "correct": False,
                              "excluded_same_session_labels": excluded,
                              "error": str(exc),
                          })
                      else:
                          rows.append({
                              "sample_id": sample.sample_id,
                              "expected": sample.expected_tile,
                              "crop": crop_kind,
                              "region": region_name,
                              "prediction": result.tile_id,
                              "confidence": round(result.confidence, 6),
                              "correct": result.tile_id == sample.expected_tile,
                              "excluded_same_session_labels": excluded,
                          })

          print("PUBLIC_IDENTITY_SHADOW_ROWS")
          print(json.dumps(rows, ensure_ascii=False, indent=2))

          summary = defaultdict(lambda: {"total": 0, "correct": 0, "conf": []})
          for row in rows:
              key = f"{row['crop']}::{row['region']}"
              if row["prediction"] is None:
                  continue
              summary[key]["total"] += 1
              summary[key]["correct"] += int(row["correct"])
              summary[key]["conf"].append(row["confidence"])

          report = {}
          for key, value in sorted(summary.items()):
              report[key] = {
                  "correct": value["correct"],
                  "total": value["total"],
                  "accuracy": round(
                      value["correct"] / value["total"], 6
                  ) if value["total"] else None,
                  "average_confidence": round(
                      sum(value["conf"]) / len(value["conf"]), 6
                  ) if value["conf"] else None,
              }
          print("PUBLIC_IDENTITY_SHADOW_SUMMARY")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
