name: Decomposition Gap Analysis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/decomposition-gap-once.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run decomposition gap analysis
        run: python -m workspace.simulator.rule_gap_benchmark --count 10 --max-examples 9
