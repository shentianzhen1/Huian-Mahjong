name: TenpaiRisk V06 Parallel Validation

on:
  push:
    paths:
      - ".github/workflows/tenpai-risk-v06-parallel-once.yml"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - block: seeds_19000_19024
            start: 19000
            stop: 19025
          - block: seeds_21000_21024
            start: 21000
            stop: 21025
          - block: seeds_23000_23024
            start: 23000
            stop: 23025
          - block: seeds_25000_25024
            start: 25000
            stop: 25025
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run identity-stable V0.6 block
        env:
          BLOCK: ${{ matrix.block }}
          START: ${{ matrix.start }}
          STOP: ${{ matrix.stop }}
        run: |
          python -B - <<'PY'
          import json, os
          from time import perf_counter
          from workspace.ai import ShantenAgent, TenpaiRiskTieBreakAgent
          from workspace.simulator import run_paired_real_matches

          def v06_factory(seed=None):
              return TenpaiRiskTieBreakAgent(seed=seed, template_samples=32)

          start = int(os.environ["START"])
          stop = int(os.environ["STOP"])
          started = perf_counter()
          report = run_paired_real_matches(
              range(start, stop),
              agent_factories=(v06_factory, ShantenAgent),
              agent_names=("TenpaiRiskV06", "ShantenV03"),
              max_steps=1000,
              initial_dealer=0,
          )
          payload = report.to_dict()
          payload.pop("per_match", None)
          payload["block"] = os.environ["BLOCK"]
          payload["elapsed_seconds"] = perf_counter() - started
          print("V06_PARALLEL_START")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          print("V06_PARALLEL_END")
          PY
