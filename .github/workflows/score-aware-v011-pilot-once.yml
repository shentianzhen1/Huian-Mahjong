name: ScoreAware V011 Pilot

on:
  push:
    paths:
      - ".github/workflows/score-aware-v011-pilot-once.yml"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { block: seeds_176000_176024, start: 176000, stop: 176025 }
          - { block: seeds_178000_178024, start: 178000, stop: 178025 }
          - { block: seeds_180000_180024, start: 180000, stop: 180025 }
          - { block: seeds_182000_182024, start: 182000, stop: 182025 }
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run ScoreAware V0.11 versus Current V0.10
        env:
          BLOCK: ${{ matrix.block }}
          START: ${{ matrix.start }}
          STOP: ${{ matrix.stop }}
        run: |
          python -B - <<'PY'
          import json, os
          from collections import Counter
          from workspace.ai import MeldAwareShantenAgent, ScoreAwareMeldAgent
          from workspace.simulator import run_paired_real_matches

          counters = Counter()

          class CountingScoreAgent(ScoreAwareMeldAgent):
              def choose_decision(self, observation, legal_actions):
                  decision = super().choose_decision(observation, legal_actions)
                  counters["decisions"] += 1
                  if "score_aware_meld_v0.11" in decision.reason:
                      counters["score_interventions"] += 1
                  if "meld_aware_v0.10" in decision.reason:
                      counters["meld_decisions"] += 1
                  return decision

          def v11(seed=None):
              return CountingScoreAgent(seed=seed, template_samples=32)

          def v10(seed=None):
              return MeldAwareShantenAgent(seed=seed, template_samples=32)

          report = run_paired_real_matches(
              range(int(os.environ["START"]), int(os.environ["STOP"])),
              agent_factories=(v11, v10),
              agent_names=("ScoreAwareV011", "CurrentV010"),
              max_steps=1000,
              initial_dealer=0,
          )
          payload = report.to_dict()
          payload.pop("per_match", None)
          payload["block"] = os.environ["BLOCK"]
          payload["decision_counts"] = dict(counters)
          print("V011_PILOT_START")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          print("V011_PILOT_END")
          PY
