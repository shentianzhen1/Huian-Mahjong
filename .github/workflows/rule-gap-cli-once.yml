name: Rule Gap CLI Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rule-gap-cli-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run rule-gap CLI smoke
        run: python -m workspace.simulator.rule_gap_benchmark --count 2 --max-examples 1
