name: One-time Simulator Benchmark
# rerun after simulation isolation fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-once.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run 100-seed swapped-seat benchmark
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          from workspace.ai import BaselineAgent
          from workspace.simulator import RandomAgent, run_many_normal_hands

          report = run_many_normal_hands(
              range(100),
              agent_factories=(RandomAgent, BaselineAgent),
              swap_seats=True,
              max_steps=1000,
          )
          data = report.to_dict()
          data.pop("per_seed", None)
          print("BENCHMARK_SUMMARY_START")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          print("BENCHMARK_SUMMARY_END")
          PY
