name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "references/**"
  pull_request:
  workflow_dispatch:

# New PR revisions supersede older runs; retain every main-branch result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Determine core test scope
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.detect.outputs.run_full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check all tracked active Python syntax before dependency installation
        run: python scripts/check_python_syntax.py
      - name: Skip costly matrix for documentation/evidence-only PRs
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"],
              text=True,
          ).splitlines()
          run_full = any(
              not (path.endswith((".md", ".txt")) or path.startswith("references/"))
              for path in paths
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"run_full={str(run_full).lower()}", file=output)
          print(f"Changed files: {len(paths)}; run full core matrix: {run_full}")
          PY

  lint:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "ruff>=0.6"
      - name: Check fatal syntax and undefined-name errors
        run: python -m ruff check --select E9,F63,F7,F82 huian mahjong_framework workspace tests scripts setup.py

  core:
    needs: scope
    name: Core regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Complete stable required check without expensive tests
        if: needs.scope.outputs.run_full != 'true'
        run: echo "No relevant code or workflow changes; expensive steps omitted."
      - uses: actions/checkout@v7
        if: needs.scope.outputs.run_full == 'true'
      - uses: actions/setup-python@v7
        if: needs.scope.outputs.run_full == 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test runner
        if: needs.scope.outputs.run_full == 'true'
        run: python -m pip install "pytest>=8,<10"
      - name: Run core regression suite, including function-style tests
        if: needs.scope.outputs.run_full == 'true'
        run: python -B -m pytest -q tests

  core-coverage:
    needs: scope
    name: Core Rules/Environment coverage
    runs-on: ubuntu-latest
    steps:
      - name: Complete stable required check without expensive tests
        if: needs.scope.outputs.run_full != 'true'
        run: echo "No relevant code or workflow changes; expensive steps omitted."
      - uses: actions/checkout@v7
        if: needs.scope.outputs.run_full == 'true'
      - uses: actions/setup-python@v7
        if: needs.scope.outputs.run_full == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install coverage
        if: needs.scope.outputs.run_full == 'true'
        run: python -m pip install "coverage>=7,<8" "pytest>=8,<10"
      - name: Measure Rules and Environment coverage
        if: needs.scope.outputs.run_full == 'true'
        run: |
          python -m coverage run --source=huian.rules,huian.environment -m pytest -q tests
          python -m coverage report --show-missing --skip-covered --fail-under=85

  dense-river-vision:
    needs: scope
    name: Dense river Vision function tests
    runs-on: ubuntu-latest
    steps:
      - name: Complete stable required check without expensive tests
        if: needs.scope.outputs.run_full != 'true'
        run: echo "No relevant code or workflow changes; expensive steps omitted."
      - uses: actions/checkout@v7
        if: needs.scope.outputs.run_full == 'true'
      - uses: actions/setup-python@v7
        if: needs.scope.outputs.run_full == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Vision and test dependencies
        if: needs.scope.outputs.run_full == 'true'
        run: python -m pip install -e ".[vision]" "pytest>=8,<10"
      - name: Run dense river function tests with real Vision dependencies
        if: needs.scope.outputs.run_full == 'true'
        run: |
          python -c "import cv2, numpy"
          python -B -m pytest -q tests/test_public_dense_river_slots.py

  legacy-advisory:
    needs: scope
    name: Legacy baseline (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Complete stable required check without expensive tests
        if: needs.scope.outputs.run_full != 'true'
        run: echo "No relevant code or workflow changes; expensive steps omitted."
      - uses: actions/checkout@v7
        if: needs.scope.outputs.run_full == 'true'
      - uses: actions/setup-python@v7
        if: needs.scope.outputs.run_full == 'true'
        with:
          python-version: "3.11"
      - name: Run legacy Core V0.1.1 tests
        if: needs.scope.outputs.run_full == 'true'
        working-directory: legacy_code/core_v0.1.1
        run: python -B -m unittest discover -s tests -v
      - name: Run legacy Environment V0.1 tests
        if: needs.scope.outputs.run_full == 'true'
        working-directory: legacy_code/environment_v0.1
        run: python -B -m unittest discover -s tests -v

  package-smoke:
    needs: scope
    name: Installed package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Complete stable required check without expensive tests
        if: needs.scope.outputs.run_full != 'true'
        run: echo "No relevant code or workflow changes; expensive steps omitted."
      - uses: actions/checkout@v7
        if: needs.scope.outputs.run_full == 'true'
      - uses: actions/setup-python@v7
        if: needs.scope.outputs.run_full == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install built project
        if: needs.scope.outputs.run_full == 'true'
        run: python -m pip install .
      - name: Verify installed package boundary outside repository root
        if: needs.scope.outputs.run_full == 'true'
        working-directory: /tmp
        run: |
          python - <<'PY'
          import importlib.util
          from importlib.metadata import files, version
          from pathlib import Path

          from huian import HuianEnvironment, HuianRules, __version__
          from workspace.ai import CurrentAgent, CURRENT_AGENT_VERSION
          from workspace.simulator import run_paired_real_matches

          assert HuianEnvironment is not None
          assert HuianRules is not None
          assert __version__ == "0.2.1"
          assert version("huian-mahjong-assistant") == __version__
          assert CURRENT_AGENT_VERSION == "v0.10"
          assert CurrentAgent.__name__ == "MeldAwareShantenAgent"
          assert callable(run_paired_real_matches)

          installed_files = {str(path).replace("\\", "/") for path in files("huian-mahjong-assistant")}
          required_prefixes = (
              "huian/",
              "mahjong_framework/",
              "workspace/ai/",
              "workspace/simulator/",
              "workspace/vision/",
              "workspace/hint_alpha/",
          )
          forbidden_prefixes = (
              "legacy_code/",
              "tests/",
              "dataset/",
              "references/",
          )
          assert not any(
              Path(path).name.startswith("test_") and path.endswith(".py")
              for path in installed_files
          ), "package-local tests leaked into wheel"
          for prefix in required_prefixes:
              assert any(path.startswith(prefix) for path in installed_files), prefix
          for prefix in forbidden_prefixes:
              assert not any(path.startswith(prefix) for path in installed_files), prefix

          # Frozen comparison baselines must not leak into the installed runtime
          # as top-level packages.
          assert importlib.util.find_spec("qzcore") is None
          assert importlib.util.find_spec("qzenv") is None
          print("installed package boundary OK")
          PY
