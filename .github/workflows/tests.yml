name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_vision:
        description: Run the advisory Vision V0.1 test job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  core:
    name: Core regression (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run core regression suite
        run: python -B -m unittest discover -s tests -v

  vision-advisory:
    name: Vision V0.1 advisory (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_vision
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional OpenCV dependency
        run: python -m pip install opencv-python-headless
      - name: Run Vision V0.1 tests
        run: python -B -m unittest workspace.vision.tiles_v0_1.test_tiles_v0_1 -v
