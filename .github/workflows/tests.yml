name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run core regression suite
        run: python -B -m unittest discover -s tests -v

  legacy-advisory:
    name: Legacy baseline (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run legacy Core V0.1.1 tests
        working-directory: legacy_code/core_v0.1.1
        run: python -B -m unittest discover -s tests -v
      - name: Run legacy Environment V0.1 tests
        working-directory: legacy_code/environment_v0.1
        run: python -B -m unittest discover -s tests -v
