name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "references/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "references/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run core regression suite
        run: python -B -m unittest discover -s tests -v

  core-coverage:
    name: Core Rules/Environment coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install coverage
        run: python -m pip install "coverage>=7,<8"
      - name: Measure Rules and Environment coverage
        run: |
          python -m coverage run --source=huian.rules,huian.environment -m unittest discover -s tests -v
          python -m coverage report --show-missing --skip-covered

  legacy-advisory:
    name: Legacy baseline (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run legacy Core V0.1.1 tests
        working-directory: legacy_code/core_v0.1.1
        run: python -B -m unittest discover -s tests -v
      - name: Run legacy Environment V0.1 tests
        working-directory: legacy_code/environment_v0.1
        run: python -B -m unittest discover -s tests -v

  package-smoke:
    name: Installed package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install built project
        run: python -m pip install .
      - name: Verify installed package boundary outside repository root
        working-directory: /tmp
        run: |
          python - <<'PY'
          import importlib.util

          from huian import HuianEnvironment, HuianRules
          from workspace.ai import CurrentAgent, CURRENT_AGENT_VERSION
          from workspace.simulator import run_paired_real_matches

          assert HuianEnvironment is not None
          assert HuianRules is not None
          assert CURRENT_AGENT_VERSION == "v0.10"
          assert CurrentAgent.__name__ == "MeldAwareShantenAgent"
          assert callable(run_paired_real_matches)

          # Frozen comparison baselines must not leak into the installed runtime
          # as top-level packages.
          assert importlib.util.find_spec("qzcore") is None
          assert importlib.util.find_spec("qzenv") is None
          print("installed package boundary OK")
          PY
