name: Shanten Agent AB Benchmark SegmentDP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/shanten-agent-ab-once.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run paired Shanten vs Baseline 8-hand matches
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          from workspace.ai import BaselineAgent, ShantenAgent
          from workspace.simulator import run_real_ordinary_match

          rows = []
          totals = {"ShantenAgent": 0, "BaselineAgent": 0}
          match_wins = {"ShantenAgent": 0, "BaselineAgent": 0, "ties": 0}
          complete = 0
          stopped = 0

          for seed in range(10):
              for swapped in (False, True):
                  factories = ((ShantenAgent, BaselineAgent)
                               if not swapped else (BaselineAgent, ShantenAgent))
                  names = (["ShantenAgent", "BaselineAgent"]
                           if not swapped else ["BaselineAgent", "ShantenAgent"])
                  result = run_real_ordinary_match(
                      seed=seed,
                      agent_factories=factories,
                      max_steps=1000,
                      initial_dealer=0,
                  )
                  if result.complete:
                      complete += 1
                      for seat, name in enumerate(names):
                          totals[name] += result.final_scores[seat]
                      if result.final_scores[0] == result.final_scores[1]:
                          match_wins["ties"] += 1
                      else:
                          winner_seat = 0 if result.final_scores[0] > result.final_scores[1] else 1
                          match_wins[names[winner_seat]] += 1
                  else:
                      stopped += 1
                  rows.append({
                      "seed": seed,
                      "swapped": swapped,
                      "status": result.status,
                      "scores": list(result.final_scores),
                      "unresolved": list(result.unresolved),
                      "settled_hands": result.progress.hand_index,
                  })

          summary = {
              "attempts": len(rows),
              "complete_matches": complete,
              "stopped_matches": stopped,
              "match_wins": match_wins,
              "average_final_score": {
                  name: (totals[name] / complete if complete else None)
                  for name in ("ShantenAgent", "BaselineAgent")
              },
              "average_score_delta_shanten_minus_base": (
                  (totals["ShantenAgent"] - totals["BaselineAgent"]) / complete
                  if complete else None
              ),
              "rows": rows,
          }
          print("SHANTEN_AB_START")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("SHANTEN_AB_END")
          PY
