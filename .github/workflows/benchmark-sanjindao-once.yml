name: One-time Sanjindao Benchmark
# rerun after loop-position fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-sanjindao-once.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run targeted Sanjindao tests
        shell: bash
        run: |
          python -B -m unittest discover -s tests -p 'test_qiangjin_window.py' -v
          python -B -m unittest discover -s tests -p 'test_normal_simulation.py' -v
      - name: Run 100-seed swapped-seat benchmark
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          from workspace.ai import BaselineAgent
          from workspace.simulator import RandomAgent, run_many_normal_hands
          report = run_many_normal_hands(
              range(100),
              agent_factories=(RandomAgent, BaselineAgent),
              swap_seats=True,
              max_steps=1000,
          )
          data = report.to_dict()
          data.pop("per_seed", None)
          print("BENCHMARK_SUMMARY_START")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          print("BENCHMARK_SUMMARY_END")
          PY
