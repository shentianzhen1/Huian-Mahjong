name: Efficiency Agent AB Benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/efficiency-agent-ab-once.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run paired Efficiency vs Baseline 8-hand matches
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          from workspace.ai import BaselineAgent, EfficiencyAgent
          from workspace.simulator import run_real_ordinary_match

          rows = []
          totals = {"EfficiencyAgent": 0, "BaselineAgent": 0}
          match_wins = {"EfficiencyAgent": 0, "BaselineAgent": 0, "ties": 0}
          complete = 0
          stopped = 0
          for seed in range(20):
              for swapped in (False, True):
                  factories = ((EfficiencyAgent, BaselineAgent)
                               if not swapped else (BaselineAgent, EfficiencyAgent))
                  result = run_real_ordinary_match(
                      seed=seed,
                      agent_factories=factories,
                      max_steps=1000,
                      initial_dealer=0,
                  )
                  names = ["EfficiencyAgent", "BaselineAgent"] if not swapped else ["BaselineAgent", "EfficiencyAgent"]
                  if result.complete:
                      complete += 1
                      for seat, name in enumerate(names):
                          totals[name] += result.final_scores[seat]
                      if result.final_scores[0] == result.final_scores[1]:
                          match_wins["ties"] += 1
                      else:
                          winner_seat = 0 if result.final_scores[0] > result.final_scores[1] else 1
                          match_wins[names[winner_seat]] += 1
                  else:
                      stopped += 1
                  rows.append({
                      "seed": seed,
                      "swapped": swapped,
                      "status": result.status,
                      "scores": list(result.final_scores),
                      "unresolved": list(result.unresolved),
                      "settled_hands": result.progress.hand_index,
                  })

          completed_samples = complete
          summary = {
              "attempts": len(rows),
              "complete_matches": complete,
              "stopped_matches": stopped,
              "match_wins": match_wins,
              "average_final_score": {
                  name: (totals[name] / completed_samples if completed_samples else None)
                  for name in ("EfficiencyAgent", "BaselineAgent")
              },
              "average_score_delta_eff_minus_base": (
                  (totals["EfficiencyAgent"] - totals["BaselineAgent"]) / completed_samples
                  if completed_samples else None
              ),
              "rows": rows,
          }
          print("EFFICIENCY_AB_START")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("EFFICIENCY_AB_END")
          PY
