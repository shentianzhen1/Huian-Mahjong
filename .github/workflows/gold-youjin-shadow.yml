name: Gold Youjin Shadow Audit

on:
  pull_request:
    paths:
      - "workspace/ai/gold_youjin.py"
      - "workspace/ai/__init__.py"
      - "workspace/simulator/gold_youjin_shadow.py"
      - "tests/test_gold_youjin.py"
      - ".github/workflows/gold-youjin-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: 1-pair Jin/Youjin structural shadow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run shadow audit
        run: |
          mkdir -p data/evaluations/gold-youjin-shadow
          /usr/bin/time -v python -B -m workspace.simulator.youjin_deficit_hand_smoke \
            --hands 2 \
            --seed-start 430000 \
            --max-steps 1000 \
            > data/evaluations/gold-youjin-shadow/report.json \
            2> data/evaluations/gold-youjin-shadow/runtime.txt

      - name: Publish summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("data/evaluations/gold-youjin-shadow/report.json").read_text())
          keys = (
              "hands_requested",
              "status_counts",
              "unknown_reasons",
              "gold_discard_decisions",
              "multi_candidate_min_shanten_decisions",
              "signal_differentiated_frontiers",
              "shadow_would_change_v010",
              "shadow_change_rate_among_gold_decisions",
              "shadow_change_rate_among_multi_frontiers",
              "mean_meld_deficit_delta_on_change",
              "changes_reducing_meld_deficit",
              "mean_immediate_live_delta_on_change",
              "mean_immediate_type_delta_on_change",
              "changes_losing_live_copies",
              "changes_losing_effective_types",
              "changes_with_live_loss_at_most_one",
              "changes_with_no_type_loss",
          )
          summary = {key: data.get(key) for key in keys}
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as fh:
              fh.write("# Jin / Youjin meld-deficit shadow audit\n\n")
              fh.write("Two fresh ordinary-hand seeds 430000..430001; both seats use the shadow policy, which always executes V0.10.\n\n")
              fh.write("```json\n")
              fh.write(json.dumps(summary, ensure_ascii=False, indent=2))
              fh.write("\n```\n")
          PY

      - name: Upload shadow report
        uses: actions/upload-artifact@v7
        with:
          name: gold-youjin-shadow-410000-1pair
          path: |
            data/evaluations/gold-youjin-shadow/report.json
            data/evaluations/gold-youjin-shadow/runtime.txt
          if-no-files-found: error
