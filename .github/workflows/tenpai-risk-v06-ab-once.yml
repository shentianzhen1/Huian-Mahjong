name: TenpaiRisk V06 AB

on:
  push:
    paths:
      - ".github/workflows/tenpai-risk-v06-ab-once.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Final identity-stable V0.6 versus V0.3 confirmation
        run: |
          python -B - <<'PY'
          import json
          from time import perf_counter
          from workspace.ai import ShantenAgent, TenpaiRiskTieBreakAgent
          from workspace.simulator import run_paired_real_matches

          def v06_factory(seed=None):
              return TenpaiRiskTieBreakAgent(seed=seed, template_samples=32)

          def run_block(name, seeds):
              started = perf_counter()
              report = run_paired_real_matches(
                  seeds,
                  agent_factories=(v06_factory, ShantenAgent),
                  agent_names=("TenpaiRiskV06", "ShantenV03"),
                  max_steps=1000,
                  initial_dealer=0,
              )
              elapsed = perf_counter() - started
              payload = report.to_dict()
              payload.pop("per_match", None)
              return {"block": name, "elapsed_seconds": elapsed, **payload}

          output = [
              run_block("seeds_7000_7049", range(7000, 7050)),
              run_block("seeds_9000_9049", range(9000, 9050)),
          ]
          print("V06_FINAL_START")
          print(json.dumps(output, ensure_ascii=False, indent=2))
          print("V06_FINAL_END")
          PY
